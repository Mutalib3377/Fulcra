# Render Blueprint — PAID setup: the web app and the background worker as two services.
# Use it when paying customers arrive: rename it to render.yaml (replacing the free one) and
# sync the Blueprint in Render, or create it from New → Blueprint.
# Values marked `sync: false` are asked for when the Blueprint is created (never commit them).
# Step-by-step guide, including Supabase, R2, Cloudflare and webhooks: docs/DEPLOY.md

services:
  # ── Web: marketing site, dashboard, stores, API and webhooks ───────────────
  - type: web
    name: fulcra-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Baked in at build time too (the landing page is static): set before the first deploy.
      - key: ROOT_DOMAIN
        sync: false
      - key: ADMIN_EMAILS # your email: opens app.fulcra.online/admin
        sync: false
      - key: ADMIN_USD_NGN_RATE
        value: '1600'
      - key: DATABASE_URL # Supabase transaction pooler (port 6543)
        sync: false
      - key: DATABASE_URL_QUEUE # Supabase session pooler (port 5432 on the pooler host)
        sync: false
      - key: DB_POOL_MAX
        value: '10'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ENCRYPTION_KEY # same value on web and worker; generate once, never change
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN # generated by Render; copy it into the Meta app's webhook settings
        generateValue: true
      - key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: FULCRA_WHATSAPP_DISPLAY_NUMBER # Fulcra's number as dialled, for WhatsApp links
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # Browser values, baked in at build time.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: production
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        value: https://eu.i.posthog.com

  # ── Worker: AI replies, webhooks processing, imports, alerts, renewals ─────
  - type: worker
    name: fulcra-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter
    autoDeploy: true
    # Applies database migrations before the new worker starts (direct connection).
    preDeployCommand: node_modules/.bin/tsx ../../packages/db/src/migrate.ts
    envVars:
      - key: ROOT_DOMAIN
        sync: false
      - key: DATABASE_URL # Supabase transaction pooler (port 6543)
        sync: false
      - key: DATABASE_URL_QUEUE # Supabase session pooler (port 5432 on the pooler host)
        sync: false
      - key: DATABASE_URL_MIGRATIONS # Supabase session pooler (port 5432): migrations and backups
        sync: false
      - key: DB_POOL_MAX
        value: '10'
      - key: ENCRYPTION_KEY # same value on web and worker; generate once, never change
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: FULCRA_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: FULCRA_WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: FULCRA_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
