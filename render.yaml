# Render Blueprint — FREE setup: one free web service runs the web app AND the worker.
# Create it from the Render dashboard: New → Blueprint → pick this repository.
# Values marked `sync: false` are asked for when the Blueprint is created (never commit them).
# Keep it awake with a free uptime monitor on /api/health every 5 minutes (docs/DEPLOY.md).
# When paying customers arrive, switch to render.paid.yaml (web + worker on paid plans).
# Step-by-step guide: docs/DEPLOY.md

services:
  - type: web
    name: fulcra
    runtime: docker
    dockerfilePath: ./deploy/free/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ROOT_DOMAIN
        sync: false
      - key: ADMIN_EMAILS # your email: opens app.yourdomain.com/admin
        sync: false
      - key: ADMIN_USD_NGN_RATE
        value: '1600'
      - key: DATABASE_URL # Supabase transaction pooler (port 6543)
        sync: false
      - key: DATABASE_URL_QUEUE # Supabase session pooler (port 5432 on the pooler host)
        sync: false
      - key: DB_POOL_MAX
        value: '10'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ENCRYPTION_KEY # generate once, never change
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: 'auto'
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: 'production'
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: 'production'
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        value: 'https://eu.i.posthog.com'
      - key: DATABASE_URL_MIGRATIONS # Supabase direct connection: migrations and backups
        sync: false
      - key: FULCRA_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: FULCRA_WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: FULCRA_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: FULCRA_WHATSAPP_DISPLAY_NUMBER # Fulcra's number as dialled, for WhatsApp links
        sync: false
      # Weekly database backup (free Supabase has none): a PRIVATE R2 bucket.
      - key: BACKUP_BUCKET
        sync: false
